<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            background: #0a0a1a;
            overflow: hidden;
            position: relative;
        }

        /* Animated background blobs */
        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 60, 255, 0.15) 0%, transparent 70%);
            top: -200px;
            left: -200px;
            animation: blobMove1 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 60, 180, 0.12) 0%, transparent 70%);
            bottom: -150px;
            right: -150px;
            animation: blobMove2 10s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes blobMove1 {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(80px, 80px) scale(1.2); }
        }

        @keyframes blobMove2 {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(-60px, -60px) scale(1.15); }
        }

        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 52px 48px;
            width: 90vw;
            max-width: 460px;
            text-align: center;
            box-shadow:
                0 0 0 1px rgba(99, 60, 255, 0.1),
                0 32px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255,255,255,0.07);
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Glowing top border accent */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            border-radius: 0 0 100px 100px;
            background: linear-gradient(90deg, transparent, #a78bfa, #f472b6, transparent);
        }

        /* Dice icon */
        .dice-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
            animation: spinIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both 0.3s;
        }

        @keyframes spinIn {
            from { opacity: 0; transform: rotate(-20deg) scale(0.5); }
            to   { opacity: 1; transform: rotate(0deg) scale(1); }
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 700;
            color: #f0eaff;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .subtitle {
            font-size: 0.85rem;
            color: rgba(180, 160, 255, 0.6);
            font-weight: 400;
            margin-bottom: 36px;
            letter-spacing: 0.3px;
        }

        /* Result box */
        .result-box {
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            margin-bottom: 28px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.4s ease;
        }

        h3.result-label {
            font-size: 1rem;
            font-weight: 500;
            color: rgba(200, 185, 255, 0.5);
            letter-spacing: 0.2px;
        }

        #result {
            font-size: 1.05rem;
            font-weight: 600;
            color: #c4b5fd;
            letter-spacing: 0.2px;
            transition: all 0.3s ease;
        }

        /* Input group */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        #input {
            flex: 1;
            padding: 14px 18px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: #f0eaff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            outline: none;
            transition: all 0.3s ease;
            -moz-appearance: textfield;
        }

        #input::-webkit-outer-spin-button,
        #input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        #input::placeholder {
            color: rgba(180, 160, 255, 0.35);
            font-weight: 400;
        }

        #input:focus {
            border-color: rgba(167, 139, 250, 0.5);
            background: rgba(167, 139, 250, 0.07);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.12);
        }

        #guess {
            padding: 14px 22px;
            min-width: 110px;
            flex-shrink: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        #guess::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #9333ea, #c026d3);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        #guess:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(124, 58, 237, 0.55);
        }

        #guess:hover::before { opacity: 1; }

        #guess:active {
            transform: translateY(0px);
            box-shadow: 0 3px 12px rgba(124, 58, 237, 0.4);
        }

        #guess span { position: relative; z-index: 1; }

        /* Clicks badge */
        .clicks-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h3.clicks-label {
            font-size: 0.88rem;
            font-weight: 400;
            color: rgba(180, 160, 255, 0.45);
            letter-spacing: 0.3px;
        }

        #clicks {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 32px;
            padding: 0 10px;
            background: rgba(167, 139, 250, 0.12);
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #a78bfa;
            transition: all 0.3s ease;
        }

        /* Ripple on button click */
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            width: 60px; height: 60px;
            margin-left: -30px; margin-top: -30px;
            animation: ripple 0.6s linear;
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="dice-icon">🎲</span>
        <h1>Guess the Number</h1>
        <p class="subtitle">Between 0 and 100 — can you crack it?</p>

        <div class="result-box">
            <h3 class="result-label">Result &nbsp;— &nbsp;<span id="result">Make your first guess!</span></h3>
        </div>

        <div class="input-group">
            <input type="number" id="input" placeholder="Enter a number…">
            <button id="guess"><span>Guess →</span></button>
        </div>

        <div class="clicks-row">
            <h3 class="clicks-label">Total Attempts</h3>
            <span id="clicks">0</span>
        </div>
    </div>

    <script>
        const inputEl = document.querySelector('#input');
        const resultEl = document.querySelector('#result');
        const guessEl = document.querySelector('#guess');
        const clicksEl = document.querySelector('#clicks');

        let randomNum = Math.floor(Math.random()*100);
        let clicks = 0;

        guessEl.addEventListener("click", () =>{
            clicks++;
            clicksEl.innerHTML = clicks;
            let input = Number(inputEl.value);

            if (input == randomNum) {
                resultEl.innerHTML = "You Win";
            } else if (input > randomNum) {
                resultEl.innerHTML = "Try lower number";
            } else if (input < randomNum) {
                resultEl.innerHTML = "Try Higher number";
            }
        })

        // Ripple effect on button (UI only)
        guessEl.addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple-effect');
            const rect = guessEl.getBoundingClientRect();
            ripple.style.left = (e.clientX - rect.left) + 'px';
            ripple.style.top  = (e.clientY - rect.top)  + 'px';
            guessEl.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    </script>

</body>
</html>
